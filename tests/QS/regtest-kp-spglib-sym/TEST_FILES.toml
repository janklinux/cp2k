# Regression test for the spglib-based k-point IBZ symmetry path
# (kpoint_density_spglib.F). For each of 26 point groups we run a
# SYMMETRY ON (FULL_GRID OFF) and a SYMMETRY OFF (FULL_GRID ON) case
# and require both to reproduce the same total energy.
# The new code path only fires for single-rank DBCSR distribution
# (see kpoint_methods.F, line ~1723) -- hence mpiranks==1 in TEST_DIRS.
# Source bench: /workspace/cp2k_spglib_integration/sym_regtest/
# Reference energies were taken from the SYMMETRY OFF runs; the
# largest observed sym/nosym disagreement is ~2.2e-9 Ha (case 07,
# BrCl, point group mm2), so tol=1.0E-8 Ha is the agreement criterion.

