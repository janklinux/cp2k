# Regression test for the multi-rank (MPI) spglib-based k-point IBZ
# symmetry path. Same 26 sym/nosym pairs as regtest-kp-spglib-sym/, but
# the dir is tagged mpiranks>=2 in TEST_DIRS so it exercises the
# parallel DM-rotation chain (numnodes > 1 in kpoint_methods.F).
# Until the MPI chain lands, dispatch falls back to the legacy symtrans
# path -- which must still reproduce the nosym reference. Once the new
# multi-rank spglib path is enabled, this regtest catches regressions.
# Reference energies match regtest-kp-spglib-sym/ (taken from the
# SYMMETRY OFF runs); tol=1.0E-8 Ha is the agreement criterion (the
# largest sym/nosym disagreement seen in the single-rank bench was
# ~2.2e-9 Ha for case 07 BrCl, point group mm2).

